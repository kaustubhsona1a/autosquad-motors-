<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <!-- Chrome White Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Dark Shield Glow -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1813" />
      <stop offset="100%" stop-color="#080705" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <g filter="url(#subtleShadow)">
    <!-- Luxury Emblem / Shield Icon -->
    <g transform="translate(15, 12)">
      <!-- Outer Shield Border -->
      <polygon points="45,4 82,18 82,60 45,92 8,60 8,18" fill="url(#shieldBg)" stroke="url(#goldGrad)" stroke-width="2.5" />
      
      <!-- Inner Shield Inset -->
      <polygon points="45,11 75,23 75,57 45,83 15,57 15,23" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5" />

      <!-- Stylized Wing / Speed Lines -->
      <path d="M 22,42 L 45,28 L 68,42 L 45,35 Z" fill="url(#goldGrad)" />
      <path d="M 26,52 L 45,40 L 64,52 L 45,46 Z" fill="url(#goldGrad)" opacity="0.85" />
      <path d="M 32,62 L 45,53 L 58,62 L 45,58 Z" fill="url(#goldGrad)" opacity="0.65" />

      <!-- Center Star Accent -->
      <polygon points="45,22 47,26 51,27 48,29 49,33 45,31 41,33 42,29 39,27 43,26" fill="#FFF8D6" />
    </g>

    <!-- Typography: AUTO (Silver/White) + SQUAD (Pure Metallic Gold) -->
    <!-- AUTO -->
    <text x="120" y="66" font-family="'Orbitron', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" font-style="italic" letter-spacing="3" fill="url(#silverGrad)">
      AUTO
    </text>

    <!-- SQUAD -->
    <text x="278" y="66" font-family="'Orbitron', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" font-style="italic" letter-spacing="3" fill="url(#goldGrad)" filter="url(#goldGlow)">
      SQUAD
    </text>

    <!-- Divider Line -->
    <line x1="122" y1="78" x2="475" y2="78" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.8" />

    <!-- Subtitle: PRE OWNED CARS • MUMBAI -->
    <text x="124" y="96" font-family="'Plus Jakarta Sans', 'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="7" fill="#E2E8F0" opacity="0.95">
      PRE OWNED CARS
    </text>
    <text x="365" y="96" font-family="'Space Grotesk', monospace, sans-serif" font-size="10" font-weight="600" letter-spacing="4" fill="#B38728">
      • EST. 2019
    </text>
  </g>
</svg>
